name: Windows build and regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configuration and isolated integration tests
        shell: pwsh
        run: ./src/Test.ps1 -SkipUi
      - name: Build portable package
        shell: pwsh
        run: ./src/Build.ps1 -FrameworkDependent -OutputDirectory "${{ runner.temp }}/wallpaper-build"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-framework-dependent
          path: |
            ${{ runner.temp }}/wallpaper-build/*.zip
            ${{ runner.temp }}/wallpaper-build/*.sha256
          if-no-files-found: error
          retention-days: 14
